slurm:
  partition: campus-new
  # Walltime per run. The full 3-method variant assignment (iqtree + embedding)
  # dominates: a light config's run measured ~17 h. Heavier (higher-mutation)
  # configs may need more; raise toward the partition max if any TIME OUT.
  time: "24:00:00"
  # Memory per array task. A light config's run peaked at ~3.3 GB (sacct
  # MaxRSS), so 64 GB was far too much. 32 GB keeps a wide margin for
  # higher-mutation configs whose O(n^2) embedding distance matrix grows.
  mem_gb: 32
  # Keep in sync with pipeline_config.yaml variant_assignment_threads.
  cpus_per_task: 16
  max_concurrent: 20  # max simultaneous array tasks (%N suffix in --array)
  conda_env: antigen
  log_dir: logs/slurm/  # relative to project_root; created automatically by SLURM
  # Absolute path to the antigen-forecasting repo on the cluster.
  # Update this to match your own cluster home directory before submitting jobs,
  # e.g. /fh/fast/matsen_e/<yourname>/antigen-forecasting
  project_root: /fh/fast/matsen_e/zthornto/antigen-forecasting
  python_bin: python  # override if conda activate does not put python on PATH
